<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>OmniAI - OpenRouter AI Chatbot</title>
  <meta name="description" content="백엔드 없이 브라우저에서 직접 OpenRouter API를 호출하는 실시간 AI 챗봇">
  
  <!-- Google Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;600&family=Outfit:wght@300;400;500;600;700&display=swap" rel="stylesheet">
  
  <!-- FontAwesome Icons -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  
  <!-- Highlight.js CSS for Code Highlighting -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.9.0/styles/tokyo-night-dark.min.css">
  
  <!-- Custom Style -->
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <div class="app-container">
    <!-- Overlay for mobile sidebar -->
    <div class="sidebar-overlay" id="sidebarOverlay"></div>

    <!-- Sidebar -->
    <aside class="sidebar" id="sidebar">
      <div class="sidebar-header">
        <div class="brand">
          <div class="brand-icon">
            <i class="fa-solid fa-brain-circuit"></i>
          </div>
          <span class="brand-title">OmniAI</span>
          <span class="badge">OpenRouter</span>
        </div>
        <button class="btn-icon mobile-only" id="closeSidebarBtn" title="사이드바 닫기">
          <i class="fa-solid fa-xmark"></i>
        </button>
      </div>

      <div class="sidebar-content">
        <!-- New Chat Button -->
        <button class="btn btn-primary new-chat-btn" id="newChatBtn">
          <i class="fa-solid fa-plus"></i> 새 대화 시작
        </button>

        <!-- API Key & Config Section -->
        <div class="config-section">
          <div class="section-title"><i class="fa-solid fa-key"></i> OpenRouter 설정</div>
          
          <div class="form-group">
            <label for="apiKeyInput">API Key</label>
            <div class="input-with-icon">
              <input type="password" id="apiKeyInput" placeholder="sk-or-v1-..." autocomplete="off">
              <button type="button" class="toggle-password" id="togglePasswordBtn" title="API Key 보기/숨기기">
                <i class="fa-solid fa-eye"></i>
              </button>
            </div>
            <span class="help-text">코드에 입력된 키가 자동 입력됩니다. 필요시 수정 가능합니다.</span>
          </div>

          <div class="form-group">
            <label for="modelSelect">AI 모델 선택</label>
            <div class="select-wrapper">
              <select id="modelSelect">
                <option value="google/gemini-2.0-flash-001">Google: Gemini 2.0 Flash (빠름/추천)</option>
                <option value="perplexity/sonar">Perplexity: Sonar (웹 검색 전문)</option>
                <option value="perplexity/sonar-reasoning">Perplexity: Sonar Reasoning (검색 + 추론)</option>
                <option value="meta-llama/llama-3.3-70b-instruct">Meta: Llama 3.3 70B Instruct</option>
                <option value="deepseek/deepseek-r1">DeepSeek: R1 (추론 특화)</option>
                <option value="openai/gpt-4o-mini">OpenAI: GPT-4o Mini</option>
                <option value="qwen/qwen-2.5-72b-instruct">Qwen: Qwen 2.5 72B Instruct</option>
                <option value="anthropic/claude-3.5-haiku">Anthropic: Claude 3.5 Haiku</option>
              </select>
            </div>
          </div>

          <!-- Web Search Plugin Toggle -->
          <div class="form-group checkbox-group">
            <label class="toggle-switch">
              <input type="checkbox" id="webSearchToggle" checked>
              <span class="slider"></span>
              <span class="toggle-label"><i class="fa-solid fa-globe"></i> 최신 웹 검색 연동 (Web Search)</span>
            </label>
            <span class="help-text">OpenRouter 웹 검색 플러그인을 활용하여 최신 정보 조회 및 거짓말(환각)을 방지합니다.</span>
          </div>

          <div class="form-group">
            <label for="temperatureInput">창의성 (Temperature): <span id="tempValue">0.7</span></label>
            <input type="range" id="temperatureInput" min="0" max="2" step="0.1" value="0.7">
          </div>

          <div class="form-group">
            <label for="systemPromptInput">시스템 프롬프트 (페르소나)</label>
            <textarea id="systemPromptInput" rows="3" placeholder="예: 당신은 친절하고 전문적인 AI 프로그래밍 튜터입니다."></textarea>
          </div>
        </div>

        <div class="sidebar-footer">
          <div class="status-indicator">
            <span class="status-dot" id="statusDot"></span>
            <span class="status-text" id="statusText">준비됨</span>
          </div>
        </div>
      </div>
    </aside>

    <!-- Main Chat Area -->
    <main class="main-content">
      <!-- Header -->
      <header class="chat-header">
        <div class="header-left">
          <button class="btn-icon mobile-only" id="openSidebarBtn" title="설정 열기">
            <i class="fa-solid fa-bars"></i>
          </button>
          <div class="current-model-info">
            <span class="model-label">현재 모델</span>
            <h2 id="currentModelDisplay" class="model-name">Google Gemini 2.0 Flash</h2>
          </div>
        </div>
        <div class="header-right">
          <button class="btn btn-secondary btn-sm" id="clearHistoryBtn" title="대화 내역 비우기">
            <i class="fa-solid fa-trash-can"></i> 대화 비우기
          </button>
        </div>
      </header>

      <!-- Messages Viewport -->
      <div class="messages-container" id="messagesContainer">
        <!-- Welcome Screen (Initial view when no messages) -->
        <div class="welcome-screen" id="welcomeScreen">
          <div class="welcome-icon">
            <i class="fa-solid fa-sparkles"></i>
          </div>
          <h1>무엇을 도와드릴까요?</h1>
          <p>OpenRouter API를 통해 최신 AI 모델들과 즉시 대화해보세요.</p>

          <!-- Quick Suggestion Chips -->
          <div class="suggestion-chips">
            <button class="chip" data-prompt="양자 컴퓨터의 원리를 초등학생도 이해할 수 있게 쉬운 비유로 설명해줘.">
              <i class="fa-solid fa-atom"></i>
              <span>양자 컴퓨터 원리 쉬운 설명</span>
            </button>
            <button class="chip" data-prompt="JavaScript 스트리밍 API(Fetch & ReadableStream)를 사용하는 간단한 코드 예제를 작성해줘.">
              <i class="fa-solid fa-code"></i>
              <span>JS 스트리밍 코드 예제</span>
            </button>
            <button class="chip" data-prompt="프로젝트 팀원들에게 성공적인 릴리즈를 축하하는 센스있는 이메일 초안 작성해줘.">
              <i class="fa-solid fa-envelope"></i>
              <span>축하 이메일 초안 작성</span>
            </button>
            <button class="chip" data-prompt="파이썬(Python)의 리스트 컴프리헨션(List Comprehension) 문법과 팁을 알려줘.">
              <i class="fa-brands fa-python"></i>
              <span>Python 팁 & 꿀팁</span>
            </button>
          </div>
        </div>

        <!-- Dynamic Messages Will Be Appended Here -->
        <div class="chat-thread" id="chatThread"></div>
      </div>

      <!-- Input Bar Container -->
      <div class="input-container">
        <form class="input-form" id="chatForm">
          <div class="textarea-wrapper">
            <textarea 
              id="userInput" 
              placeholder="메시지를 입력하세요... (Shift + Enter로 줄바꿈)" 
              rows="1"
              required
            ></textarea>
          </div>
          <div class="input-actions">
            <button type="submit" class="btn-send" id="sendBtn" title="보내기">
              <i class="fa-solid fa-paper-plane"></i>
            </button>
            <button type="button" class="btn-stop hidden" id="stopBtn" title="생성 중단">
              <i class="fa-solid fa-square"></i>
            </button>
          </div>
        </form>
        <div class="input-footer-note">
          <i class="fa-solid fa-shield-halved"></i> API Key는 브라우저 내부 메모리에만 유지되며 외부로 유출되지 않습니다.
        </div>
      </div>
    </main>
  </div>

  <!-- External Libraries: Marked (Markdown) & Highlight.js (Code highlighting) -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/marked/12.0.1/marked.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.9.0/highlight.min.js"></script>
  
  <!-- Custom JS -->
  <script src="app.js"></script>
</body>
</html>
